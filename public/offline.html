<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171a16" />
    <title>JazzLog — Offline</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          17px/1.6 system-ui,
          sans-serif;
        background: #181b17;
        color: #f0eddf;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
      }
      h1 {
        font-family: Georgia, serif;
        line-height: 1.2;
      }
      p {
        color: #afb3a6;
      }
      a {
        display: inline-block;
        padding: 0.6rem 1rem;
        border-radius: 0.4rem;
        background: #c2ceac;
        color: #181b17;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p>JazzLog · The Listening Room</p>
      <h1>You’re offline</h1>
      <p>Connect to the internet to open your library and save listens.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
